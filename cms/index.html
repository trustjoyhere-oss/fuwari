<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex, nofollow, noarchive" />
		<meta name="referrer" content="no-referrer" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f7f7fb" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#11111b" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="小辉辉博客后台" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; frame-src 'self' https://www.youtube-nocookie.com https://player.bilibili.com; connect-src 'self' https://api.github.com https://github.com https://raw.githubusercontent.com https://*.githubusercontent.com; worker-src 'self' blob:"
		/>
		<link rel="icon" href="/favicon/favicon-light-32.png" sizes="32x32" />
		<link rel="apple-touch-icon" href="/favicon/favicon-light-180.png" />
		<link rel="manifest" href="/admin/manifest.webmanifest" />
		<link rel="stylesheet" href="/admin/admin.css" />
		<title>博客管理后台</title>
	</head>
	<body data-pagefind-ignore="all">
		<div id="nc-root"></div>
		<div id="cms-boot-status" role="status" aria-live="polite">
			<section class="boot-card" aria-labelledby="boot-title">
				<div class="boot-brand">
					<img src="/favicon/favicon-light-192.png" alt="" width="56" height="56" />
					<div>
						<span class="boot-kicker">FUWARI · SVELTIA CMS</span>
						<h1 id="boot-title">小辉辉博客管理后台</h1>
					</div>
				</div>
				<p id="cms-boot-message">正在加载安全的内容管理工具……</p>
				<div class="boot-progress" aria-hidden="true"><span></span></div>
				<p id="cms-boot-detail">文章和媒体直接保存在 GitHub；页面不会收集访问统计。</p>
				<div id="cms-boot-actions" class="boot-actions" hidden>
					<button type="button" data-cms-retry>重新加载</button>
					<a href="/">返回博客</a>
				</div>
			</section>
		</div>
		<noscript>
			<p class="boot-noscript">后台需要 JavaScript 才能运行。请启用 JavaScript 后重新打开此页面。</p>
		</noscript>
		<script src="/admin/boot.js"></script>
		<script type="module" src="/main.ts"></script>
	</body>
</html>
